# Description: ClusterRole for the LogicMonitor operator manager.
# Description: Defines permissions needed to manage LMContainer resources, Helm releases, and child component RBAC delegation.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
  labels:
    app.kubernetes.io/name: logicmonitor-operator
    app.kubernetes.io/part-of: logicmonitor-operator
rules:
  ##
  ## Base operator rules
  ##

  # Namespaces - read and update (argus child role requires update)
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
      - update

  ##
  ## Rules for monitoring.logicmonitor.com/v1alpha1, Kind: LMContainer
  ##
  - apiGroups:
      - monitoring.logicmonitor.com
    resources:
      - lmcontainers
      - lmcontainers/status
      - lmcontainers/finalizers
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  ##
  ## Rules for logicmonitor.com CollectorSet CRD (managed by collectorset-controller)
  ##
  - apiGroups:
      - logicmonitor.com
    resources:
      - collectorsets
      - collectorsets/status
      - collectorsets/finalizers
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  ##
  ## Core API resources - needed by Helm chart components
  ## Includes resources required by argus, collectorset-controller, and collector child roles
  ##
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/log
      - services
      - services/finalizers
      - endpoints
      - persistentvolumeclaims
      - events
      - configmaps
      - secrets
      - serviceaccounts
      - nodes
      - nodes/metrics
      - nodes/proxy
      - nodes/stats
      - componentstatuses
      - containers
      - limitranges
      - persistentvolumes
      - replicationcontrollers
      - resourcequotas
    verbs:
      - create
      - delete
      - deletecollection
      - get
      - list
      - patch
      - update
      - watch

  ##
  ## Apps API resources - deployments, statefulsets for components
  ##
  - apiGroups:
      - apps
    resources:
      - deployments
      - deployments/scale
      - daemonsets
      - replicasets
      - statefulsets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  ##
  ## Batch API resources - jobs for collector setup
  ##
  - apiGroups:
      - batch
    resources:
      - jobs
      - cronjobs
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  ##
  ## RBAC API resources - needed to create roles for components
  ## escalate + bind required because child chart ClusterRoles use wildcard verbs
  ## and aggregationRules that require elevated RBAC privileges to create
  ##
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
      - rolebindings
      - clusterroles
      - clusterrolebindings
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
      - escalate
      - bind

  ##
  ## Networking API resources
  ##
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
      - ingressclasses
      - networkpolicies
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  ##
  ## Policy API resources
  ##
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  ##
  ## Coordination API resources - leader election
  ##
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  ##
  ## OpenShift-specific resources
  ##
  - apiGroups:
      - security.openshift.io
    resources:
      - securitycontextconstraints
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
      - use

  ##
  ## Monitoring resources - for Prometheus integration
  ##
  - apiGroups:
      - monitoring.coreos.com
    resources:
      - servicemonitors
      - podmonitors
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  ##
  ## Discovery API - for kube-state-metrics
  ##
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch

  ##
  ## Autoscaling API
  ##
  - apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  ##
  ## API Extensions - CRDs managed by the Helm chart (CollectorSet CRD)
  ##
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  ##
  ## Storage API - storageclasses monitored by argus/collector
  ##
  - apiGroups:
      - storage.k8s.io
    resources:
      - storageclasses
      - volumeattachments
    verbs:
      - list
      - get
      - watch
      - update

  ##
  ## Scheduling API - priorityclasses monitored by argus/collector
  ##
  - apiGroups:
      - scheduling.k8s.io
    resources:
      - priorityclasses
    verbs:
      - list
      - get
      - watch
      - update

  ##
  ## Cert-Manager API - certificates monitored by collector
  ##
  - apiGroups:
      - cert-manager.io
    resources:
      - certificates
    verbs:
      - list
      - get

  ##
  ## Extensions API (legacy) - required by collector child role
  ##
  - apiGroups:
      - extensions
    resources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    verbs:
      - list
      - get

  ##
  ## Admission registration - webhooks monitored by kube-state-metrics
  ##
  - apiGroups:
      - admissionregistration.k8s.io
    resources:
      - mutatingwebhookconfigurations
      - validatingwebhookconfigurations
    verbs:
      - list
      - watch

  ##
  ## Certificates API - CSRs monitored by kube-state-metrics
  ##
  - apiGroups:
      - certificates.k8s.io
    resources:
      - certificatesigningrequests
    verbs:
      - list
      - watch

  ##
  ## Non-resource URLs - required by argus and collector for health checks and metrics
  ##
  - nonResourceURLs:
      - /
      - /healthz
      - /healthz/*
      - /metrics
      - /proxy
    verbs:
      - get

  # +kubebuilder:scaffold:rules
